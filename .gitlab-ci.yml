stages:
  - test
  - mirror

validate-plugin:
  stage: test
  image: python:3.12-alpine
  script:
    - python -m json.tool .agents/plugins/marketplace.json
    - python -m json.tool plugins/karabo-release-notes/.codex-plugin/plugin.json
    - python -m py_compile plugins/karabo-release-notes/skills/karabo-device-release-notes/scripts/release_notes.py
    - python plugins/karabo-release-notes/skills/karabo-device-release-notes/scripts/release_notes.py --help
    - >-
      python -c "from pathlib import Path;
      p = Path('plugins/karabo-release-notes/skills/karabo-device-release-notes');
      text = (p / 'SKILL.md').read_text();
      assert text.startswith('---\n');
      assert '[TODO:' not in text;
      assert all((p / 'references' / name).is_file() for name in
      ['setup.md', 'summary-format.md', 'karabo-changes.md'])"
    - python -m json.tool plugins/karabo-device-development/.codex-plugin/plugin.json
    - >-
      python -m py_compile
      plugins/karabo-device-development/skills/karabo-device-development/scripts/analyze_coverage.py
      plugins/karabo-device-development/skills/karabo-device-development/scripts/compare_coverage.py
    - python plugins/karabo-device-development/skills/karabo-device-development/scripts/analyze_coverage.py --help
    - python plugins/karabo-device-development/skills/karabo-device-development/scripts/compare_coverage.py --help
    - >-
      python -c "from pathlib import Path;
      path = Path(\"plugins/karabo-device-development/skills/karabo-device-development/SKILL.md\");
      text = path.read_text(encoding=\"utf-8\");
      assert text.startswith(\"---\n\"), \"SKILL.md must start with YAML frontmatter\";
      assert \"\n---\n\" in text[4:], \"SKILL.md frontmatter must be closed\";
      assert \"[TODO:\" not in text, \"SKILL.md contains a TODO placeholder\""

mirror-github:
  stage: mirror
  image: alpine:3.20
  variables:
    GIT_STRATEGY: empty
  resource_group: github-mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - git clone --bare "$CI_REPOSITORY_URL" mirror.git
    - >-
      git -C mirror.git push --prune
      "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/European-XFEL/Karabo-codex-plugins.git"
      '+refs/heads/*:refs/heads/*'
      '+refs/tags/*:refs/tags/*'
